<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title | default: site.title | escape }}</title>
    <style>
      :root { color-scheme: light; font-family: Georgia, serif; color: #202b2b; background: #f5f7f5; }
      * { box-sizing: border-box; }
      body { margin: 0; }
      .site-header { background: #173d3a; color: #fff; border-bottom: 5px solid #d5ae57; }
      .site-header-inner { max-width: 1080px; margin: auto; padding: 18px 24px; font: 700 13px/1.4 sans-serif; text-transform: uppercase; }
      main { max-width: 1080px; margin: auto; padding: 64px 24px 96px; }
      h1 { max-width: 850px; margin: 0 0 56px; font-size: 3.75rem; line-height: 1.15; }
      h2 { margin: 0 0 24px; padding-bottom: 16px; border-bottom: 1px solid #aebfba; font-size: 1.75rem; }
      h3 { margin: 0; padding: 22px 0; border-bottom: 1px solid #d6dfdb; font: 600 1.1rem/1.4 sans-serif; }
      a { color: #12675e; }
      @media (max-width: 600px) { main { padding-top: 40px; } h1 { margin-bottom: 40px; font-size: 2rem; } }
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="site-header-inner">Coordinación académica</div>
    </header>
    <main>
      {{ content }}
    </main>
  </body>
</html>
